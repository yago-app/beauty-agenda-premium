<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Veja fotos e trabalhos realizados por salões e profissionais no Beauty Agenda Premium."><title>Portfólio de trabalhos | Beauty Agenda Premium</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#fff9fb;color:#332731;font:14px 'DM Sans',sans-serif}header{padding:20px max(20px,calc((100vw - 1120px)/2));background:white;display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #f2dfe8}header a:first-child{font:700 24px 'Playfair Display',serif}a{color:#ce3e7b;text-decoration:none}main{max-width:1120px;margin:auto;padding:60px 20px 90px}.eyebrow{font-size:11px;letter-spacing:2px;color:#b78b3a;font-weight:700}h1{font:700 clamp(36px,5vw,54px) 'Playfair Display',serif;margin:12px 0}.subtitle{color:#746b73;line-height:1.7}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:34px 0}.tile{margin:0;position:relative;border-radius:17px;overflow:hidden;background:#f8e9ef;box-shadow:0 8px 24px #5e25400c}.tile img{display:block;width:100%;aspect-ratio:1;object-fit:cover;cursor:zoom-in}.tile button{position:absolute;top:10px;right:10px;border:0;border-radius:20px;padding:8px 12px;color:#9e275c;background:#fff;font-weight:700;cursor:pointer}.button{display:inline-block;padding:14px 18px;background:#d9437d;color:#fff;border-radius:12px;font-weight:700}.lightbox{position:fixed;inset:0;background:#160b13e8;display:none;align-items:center;justify-content:center;padding:30px;z-index:20}.lightbox.open{display:flex}.lightbox img{max-width:95vw;max-height:86vh;object-fit:contain}.lightbox button{position:absolute;top:18px;right:18px;background:#fff;color:#333;border:0;border-radius:30px;padding:12px 17px;cursor:pointer}@media(max-width:700px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}@media(max-width:440px){.gallery{grid-template-columns:1fr 1fr}.tile img{aspect-ratio:.8}}</style></head><body><header><a href="index.html">✿ Beauty Agenda</a><a id="back" href="index.html">← Voltar ao perfil</a></header><main><div class="eyebrow">TRABALHOS REALIZADOS</div><h1 id="title">Portfólio</h1><p class="subtitle" id="intro">Conheça os trabalhos e inspire-se para o seu próximo agendamento.</p><p class="subtitle" id="status">Carregando fotos...</p><div id="gallery" class="gallery"></div><a id="book" class="button" href="index.html">Ver serviços e agendar →</a></main><div id="lightbox" class="lightbox" role="dialog" aria-label="Visualizar foto" aria-modal="true"><button id="close" aria-label="Fechar imagem">✕ Fechar</button><img id="large" alt="Foto ampliada do portfólio"></div><script>window.addEventListener('load',async()=>{const id=new URLSearchParams(location.search).get('id');const $=x=>document.getElementById(x);const db=window.supabase.createClient('https://bxytrhtjtjpnmnjjmehi.supabase.co','sb_publishable_CBMsgDM8fwdsPaGCmADjlg_AkN99U9J');if(!id||!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)){$('status').textContent='Link de portfólio inválido.';return}const link='estabelecimento.html?id='+encodeURIComponent(id);$('back').href=link;$('book').href=link;const [{data:business,error:be},{data:photos,error:pe}]=await Promise.all([db.rpc('public_business_directory',{p_business_id:id}),db.storage.from('business-media').list(id,{limit:100})]);if(be||!business?.length){$('status').textContent='Este perfil não está disponível publicamente.';$('book').hidden=true;return}const name=business[0].display_name||'Profissional';$('title').textContent='Portfólio de '+name;document.title='Portfólio de '+name+' | Beauty Agenda Premium';if(pe){$('status').textContent='Não foi possível carregar as fotos: '+pe.message;return}const files=(photos||[]).filter(f=>/\.(jpg|jpeg|png|webp)$/i.test(f.name)).slice(-50).reverse();$('status').textContent=files.length?files.length+' foto(s) de trabalhos publicados.':'Este profissional ainda não publicou fotos.';for(const f of files){const figure=document.createElement('figure');figure.className='tile';const img=document.createElement('img');img.loading='lazy';img.alt='Trabalho realizado por '+name;img.src=db.storage.from('business-media').getPublicUrl(id+'/'+f.name).data.publicUrl;img.onclick=()=>{$('large').src=img.src;$('lightbox').classList.add('open')};figure.append(img);$('gallery').append(figure)}$('close').onclick=()=>{$('lightbox').classList.remove('open');$('large').src=''};$('lightbox').onclick=e=>{if(e.target===$('lightbox'))$('close').click()};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('close').click()})});</script></body></html>
