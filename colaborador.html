<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área do colaborador | Beauty Agenda Premium</title><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>body{font:15px system-ui;background:#fff7fa;color:#352732;margin:0}header,main{padding:24px;max-width:750px;margin:auto}header{background:white;max-width:none}a{color:#c53676}section{background:white;border:1px solid #efdbe4;border-radius:16px;padding:22px;margin:18px 0}button{background:#d84680;color:white;border:0;border-radius:9px;padding:12px 16px;cursor:pointer}li{padding:12px 0;border-bottom:1px solid #eee}small{color:#776b74}</style></head><body><header><a href="index.html">✿ Beauty Agenda Premium</a></header><main><h1>Minha área de colaborador</h1><p id="status">Verificando sua conta…</p><section><h2>Convites recebidos</h2><div id="invites"></div></section><section><h2>Meus salões</h2><div id="memberships"></div><small>Agenda individual, presença online e ações de atendimento serão liberadas nas próximas etapas, com permissões específicas.</small></section></main><script>window.addEventListener('load',async()=>{const db=window.supabase.createClient('https://bxytrhtjtjpnmnjjmehi.supabase.co','sb_publishable_CBMsgDM8fwdsPaGCmADjlg_AkN99U9J');const $=id=>document.getElementById(id),item=(tag,text)=>{const e=document.createElement(tag);e.textContent=text;return e};const {data:{user}}=await db.auth.getUser();if(!user){$('status').textContent='Entre primeiro com o e-mail convidado no Beauty Agenda Premium.';const a=item('a','Ir para login');a.href='index.html';$('invites').append(a);return}$('status').textContent='Conectado como '+(user.email||'usuário');async function load(){const [i,m]=await Promise.all([db.rpc('my_team_invitations'),db.rpc('my_team_memberships')]);for(const [id,r,empty] of [['invites',i,'Nenhum convite pendente.'],['memberships',m,'Você ainda não está vinculado a um salão.']]){const box=$(id);box.replaceChildren();if(r.error){box.append(item('p',r.error.message));continue}if(!r.data?.length){box.append(item('p',empty));continue}for(const row of r.data){const div=item('div',row.salon_name+' — '+row.member_name+' ');div.style.marginBottom='14px';if(id==='invites'){const b=item('button','Aceitar convite');b.onclick=async()=>{b.disabled=true;const {error}=await db.rpc('accept_team_invitation',{p_member_id:row.member_id});if(error){alert(error.message);b.disabled=false}else await load()};div.append(b)}box.append(div)}}}await load()});</script></body></html>
