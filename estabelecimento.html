<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil | Beauty Agenda Premium</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script><style>:root{--pink:#dc477f;--gold:#bd8c35;--ink:#28212a;--line:#f0e2e8}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:15px 'DM Sans',sans-serif;background:#fff}header{padding:20px max(24px,calc((100vw - 1080px)/2));border-bottom:1px solid var(--line)}a{color:var(--pink)}.brand{font:700 25px 'Playfair Display',serif;text-decoration:none}.hero{background:linear-gradient(120deg,#fff0f6,#fff 60%,#fef5e9);padding:65px 24px}.wrap{max-width:1040px;margin:auto}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--gold);font-weight:700}h1,h2,h3{font-family:'Playfair Display',serif}h1{font-size:clamp(36px,5vw,58px);margin:14px 0}p{line-height:1.7;color:#6e6770;white-space:pre-wrap}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;padding:32px 20px}.panel{padding:25px;border:1px solid var(--line);border-radius:18px;margin-bottom:20px}.tag{display:inline-block;background:#fff0f6;color:var(--pink);padding:7px 11px;border-radius:20px;font-size:12px;font-weight:700}.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.photos img{width:100%;aspect-ratio:1.2;object-fit:cover;border-radius:13px}.service{border-bottom:1px solid var(--line);padding:15px 0}.service strong{font-size:17px}.service small{display:block;margin-top:6px;color:#8d6878}.btn{display:inline-block;background:var(--pink);color:white;padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:700}.muted{color:#756e78}.hidden{display:none}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="index.html">✿ Beauty Agenda</a> <a href="buscar.html" style="float:right">← Voltar à busca</a></header><section class="hero"><div class="wrap"><span class="eyebrow">PERFIL BEAUTY AGENDA</span><h1 id="name">Carregando perfil...</h1><p id="specialties"></p><div id="tags"></div></div></section><main class="wrap"><p id="status" role="status" style="padding:0 20px"></p><div id="content" class="grid hidden"><div><section class="panel"><h2>Sobre</h2><p id="bio"></p></section><section class="panel"><h2>Serviços e valores</h2><div id="services"></div></section><section class="panel"><h2>Portfólio</h2><div id="photos" class="photos"></div><p class="muted" id="photoEmpty"></p></section></div><div><section class="panel"><h2>Atendimento</h2><p id="hours"></p><p id="region"></p><p id="privacy"></p><div id="contacts"></div><p><a id="bookLink" class="btn" href="agendamentos.html">Solicitar agendamento</a></p></section><section class="panel"><h2>Agendamento e avaliações</h2><p>Em breve, você poderá agendar e avaliar seus atendimentos diretamente pelo Beauty Agenda.</p></section></div></div></main><script>const $=id=>document.getElementById(id);document.addEventListener('DOMContentLoaded',async()=>{try{const id=new URLSearchParams(location.search).get('id');if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id||''))throw Error('Perfil não encontrado.');const api=window.supabase.createClient('https://bxytrhtjtjpnmnjjmehi.supabase.co','sb_publishable_CBMsgDM8fwdsPaGCmADjlg_AkN99U9J');const {data,error}=await api.rpc('public_business_directory',{p_business_id:id});if(error)throw error;const b=data?.[0];if(!b)throw Error('Este perfil ainda não está disponível publicamente.');document.title=b.display_name+' | Beauty Agenda';$('bookLink').href='agendamentos.html?id='+encodeURIComponent(b.business_id);$('name').textContent=b.display_name;$('specialties').textContent=b.specialties||'Profissional de beleza';$('bio').textContent=b.bio||'Este estabelecimento ainda não adicionou uma descrição.';$('hours').textContent=b.opening_hours||'Horários ainda não informados.';$('region').textContent=(b.neighborhood?b.neighborhood+' • ':'')+b.city+' / '+b.state;$('privacy').textContent=b.visibility==='privado'?'O endereço é privado.':b.visibility==='regiao'?'O endereço completo é reservado.':'Endereço público autorizado; exibição completa em desenvolvimento.';const tag=document.createElement('span');tag.className='tag';tag.textContent=b.service_mode==='domicilio'?'Atende em domicílio':b.service_mode==='ambos'?'Estabelecimento e domicílio':'Atendimento no estabelecimento';$('tags').append(tag);if(b.whatsapp){const a=document.createElement('a');a.className='btn';a.target='_blank';a.rel='noopener noreferrer';a.href='https://wa.me/'+encodeURIComponent(b.whatsapp)+'?text='+encodeURIComponent('Olá! Conheci seu perfil no Beauty Agenda Premium.');a.textContent='Conversar no WhatsApp';$('contacts').append(a)}if(b.instagram){const a=document.createElement('a');a.textContent='Instagram';a.target='_blank';a.rel='noopener noreferrer';const v=b.instagram.trim();a.href=v.startsWith('@')||/^[a-zA-Z0-9._]+$/.test(v)?'https://instagram.com/'+encodeURIComponent(v.replace(/^@/,'')):/^https:\/\/(www\.)?instagram\.com\//i.test(v)?v:'https://instagram.com/';$('contacts').append(document.createElement('p'),a)}const {data:services,error:se}=await api.rpc('public_business_services',{p_business_id:id});if(se)throw se;for(const s of services||[]){const div=document.createElement('div');div.className='service';const title=document.createElement('strong');title.textContent=s.name;const price=document.createElement('small');price.textContent='R$ '+(s.price_cents/100).toFixed(2).replace('.',',')+' • '+s.duration_minutes+' min';const desc=document.createElement('p');desc.textContent=s.description;div.append(title,price,desc);$('services').append(div)}if(!services?.length)$('services').textContent='Nenhum serviço publicado ainda.';const {data:photos,error:pe}=await api.storage.from('business-media').list(id,{limit:40});if(!pe){for(const f of photos||[]){if(!/\.(jpg|png|webp)$/i.test(f.name))continue;const img=document.createElement('img');img.loading='lazy';img.alt='Trabalho do portfólio';img.src=api.storage.from('business-media').getPublicUrl(id+'/'+f.name).data.publicUrl;$('photos').append(img)}}if(!$('photos').children.length)$('photoEmpty').textContent='Fotos ainda não adicionadas.';$('content').classList.remove('hidden')}catch(e){$('name').textContent='Perfil indisponível';$('status').textContent=e.message||'Não foi possível carregar o perfil.'}});</script><style>.ba-auth-links{position:fixed;right:14px;bottom:16px;z-index:1000;display:flex;gap:8px;padding:8px;background:#fffffff2;border:1px solid #f0dce4;border-radius:16px;box-shadow:0 8px 32px #57213a29;backdrop-filter:blur(8px)}.ba-auth-links a{font:700 12px 'DM Sans',Arial,sans-serif;text-decoration:none;border-radius:10px;padding:11px 14px;color:#d9437d;border:1px solid #efc6d5;background:white}.ba-auth-links a:last-child{color:white;background:#dc477f;border-color:#dc477f}@media(max-width:460px){.ba-auth-links{right:8px;bottom:8px}.ba-auth-links a{padding:10px}}</style><nav class="ba-auth-links" aria-label="Acesso à conta"><a id="ba-login" href="index.html?auth=login">Entrar</a><a id="ba-register" href="index.html?auth=register">Criar conta</a></nav><script>(function(){const next=location.pathname+location.search+location.hash;for(const [id,mode] of [['ba-login','login'],['ba-register','register']]){document.getElementById(id).href='index.html?auth='+mode+'&next='+encodeURIComponent(next)}})();</script></body></html>
